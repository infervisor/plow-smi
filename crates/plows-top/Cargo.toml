[package]
name = "plows-top"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Professional terminal GPU & system monitor — like htop for GPUs"

[dependencies]
clap = { version = "4", features = ["derive"] }

# Use the exporter library for GPU + system data collection (plows-gpu backed)
plows-exporter = { path = "../plows-exporter", default-features = true, features = ["gpu", "system"] }

# Process info type from unified GPU crate
plows-gpu = { path = "../plows-gpu" }

# TUI framework
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"

# Async runtime (needed to call async collectors)
tokio = { workspace = true }

# System info (per-core CPU, etc.)
sysinfo = { workspace = true }

# Error reporting
anyhow = { workspace = true }

# Time formatting
chrono = "0.4"

[[bin]]
name = "plows-top"
path = "src/main.rs"

[lib]
name = "plows_top"
path = "src/lib.rs"
