[package]
name = "plows-exporter"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Professional GPU metrics exporter for Prometheus (AMD, NVIDIA, Intel, TPU, System)"

[features]
default = ["gpu", "system"]
# Unified runtime GPU backends via plows-gpu (NVML / AMD SMI / Level Zero).
gpu = []
# Legacy aliases kept so existing `--features nvidia/amd` command lines keep working.
nvidia = ["gpu"]
amd = ["gpu"]
system = ["dep:sysinfo"]
tpu = ["dep:reqwest"]

[dependencies]
# Async runtime
tokio = { workspace = true }

# Web framework for Prometheus endpoint
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

# Metrics
prometheus = { version = "0.14", default-features = false }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async trait support
async-trait = "0.1"

# Lazy statics
once_cell = "1"

# Hostname detection
whoami = "1"

# Unified GPU metrics (dlopen NVML / AMD SMI / Level Zero)
plows-gpu = { path = "../plows-gpu" }

# Optional: System metrics
sysinfo = { workspace = true, optional = true }

# Optional: TPU support (HTTP client for GCE metadata + TPU runtime)
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }

[[bin]]
name = "plows-exporter"
path = "src/main.rs"
