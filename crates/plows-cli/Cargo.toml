[package]
name = "plows-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Unified Plow SMI CLI — export, monitor, and control GPUs from one binary"

[features]
default = []
tpu = ["plows-exporter/tpu"]

[dependencies]
plows-exporter = { path = "../plows-exporter", default-features = true, features = ["gpu", "system"] }
plows-ctl = { path = "../plows-ctl" }
plows-top = { path = "../plows-top" }

clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[bin]]
name = "plow-smi"
path = "src/main.rs"
