name: Nix builds and releases

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-darwin
            runner: macos-15-intel
          - system: aarch64-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate platform and release version
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "$EXPECTED_SYSTEM"
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          tag = os.environ['RELEASE_TAG']
          if tag and tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} must match Cargo workspace version v{version}')
          PY
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build and test workspace
        run: nix flake check --print-build-logs
      - name: Test optional features and lint
        run: |
          nix develop -c cargo test --workspace --all-features --locked
          nix develop -c cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Audit Rust dependencies
        if: matrix.system == 'x86_64-linux'
        run: nix develop --command nix shell --inputs-from . nixpkgs#cargo-audit --command cargo audit --deny warnings
      - name: Test control contracts with mock NVML
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build .#all --out-link result-workspace
          PLOW_TEST_BIN_DIR=result-workspace/bin python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build portable release
        run: nix build '.#packages.${{ matrix.system }}.release' --print-build-logs
      - name: Test archives outside the Nix store
        run: python3 scripts/test-release.py result
      - uses: actions/upload-artifact@v4
        with:
          name: plow-smi-${{ matrix.system }}
          path: result/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plow-smi-*
          merge-multiple: true
          path: artifacts
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: artifacts
        run: |
          sha256sum --check ./*.sha256
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
            --title "Plow SMI $RELEASE_TAG" "${prerelease[@]}" ./*.tar.gz SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
