name: Nix builds and releases

# A merge to main is a release: CI picks the next version, bumps it with
# `nix run .#bump`, builds and tests every platform at that version, tags it,
# and publishes to GitHub Releases and to the registry (pdist). Nobody edits a
# version or pushes a tag by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A run on main ends in a release, so it is never cancelled part-way.
concurrency:
  group: nix-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The version a push to main releases; empty for every other run, which
  # builds and tests the version in Cargo.toml and publishes nothing.
  version:
    name: Release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      next: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test release automation
        run: nix build .#checks.x86_64-linux.release-ci --print-build-logs
      - name: Decide the version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          next="$(nix run .#release-version)"
          echo "next=$next" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.system }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-darwin
            runner: macos-15-intel
          - system: aarch64-darwin
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate platform
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "$EXPECTED_SYSTEM"
      # Every platform builds the version the publish job will tag.
      - name: Bump to the release version
        if: needs.version.outputs.next != ''
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: nix run .#bump -- "$NEXT"
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build and test workspace
        run: nix flake check --print-build-logs
      - name: Test optional features and lint
        run: |
          nix develop -c cargo test --workspace --all-features --locked
          nix develop -c cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Audit Rust dependencies
        if: matrix.system == 'x86_64-linux'
        run: nix develop --command nix shell --inputs-from . nixpkgs#cargo-audit --command cargo audit --deny warnings
      - name: Test control contracts with mock NVML
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build .#all --out-link result-workspace
          PLOW_TEST_BIN_DIR=result-workspace/bin python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build portable release
        run: nix build '.#packages.${{ matrix.system }}.release' --print-build-logs
      - name: Test archives outside the Nix store
        run: python3 scripts/test-release.py result
      - uses: actions/upload-artifact@v4
        with:
          name: plow-smi-${{ matrix.system }}
          path: result/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release
    if: needs.version.outputs.next != ''
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The registry credentials are this environment's secrets, so no other job
    # and no pull request can read them.
    environment: pdist
    permissions:
      contents: write
    env:
      NEXT: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The bump commit is kept by its tag only and never reaches main. The
      # tag reserves the version before anything is uploaded.
      - name: Bump, commit and tag
        id: tag
        run: |
          git fetch --tags --quiet origin
          commit="$(nix run .#release-tag -- "$NEXT")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: plow-smi-*
          merge-multiple: true
          path: artifacts
      - name: Verify checksums and publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: nix run .#publish-github -- artifacts "$NEXT"
      # The same archives, under v1/plow-smi/<version>/<triple>/ on pdist.
      # Version directories are create-only, so a re-run adopts what is there.
      - name: Publish to the registry
        env:
          COMMIT: ${{ steps.tag.outputs.commit }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: nix run .#publish-pdist -- artifacts "$NEXT" "$COMMIT"
