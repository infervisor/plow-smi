[workspace]
members = [
    "crates/plows-gpu",
    "crates/plows-exporter",
    "crates/plows-top",
    "crates/plows-ctl",
    "crates/plows-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["Shaswot Paudel <shaswot@infervisor.ai>"]
repository = "https://github.com/infervisor/plow-smi"
license = "Apache-2.0"

[workspace.dependencies]
# Shared dependencies across workspace
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "component"] }
whoami = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
async-trait = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
